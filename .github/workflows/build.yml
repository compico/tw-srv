name: build

# Сборка запускается только при создании тега версии: v1.0.0, v1.2.3 и т. д.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Проверка: генерация gRPC-кода, tidy, vet, тесты, сборка фронтенда.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Frontend
        run: make frontend

      - name: Generate gRPC code and resolve modules
        run: make proto tidy

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

      # go.sum и сгенерированный код можно забрать из артефакта и закоммитить,
      # чтобы сборка стала воспроизводимой.
      - uses: actions/upload-artifact@v6
        with:
          name: go-generated
          path: |
            go.mod
            go.sum
            internal/authpb/
          if-no-files-found: error

  # Публикация двух образов в GHCR.
  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [twitch-auth, memealerts]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tw-srv-${{ matrix.service }}
          # Для тега v1.2.3 публикуются v1.2.3, v1.2 и v1.
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
