name: tw-srv

# Два сервиса на двух доменах, у каждого своя SQLite в своём томе.
# AUTH_DOMAIN: twitch-auth (вход через Twitch), APP_DOMAIN: memealerts (панель и API).
# gRPC (twitch-auth:9090) доступен только внутри сети compose, наружу не публикуется.
services:
  twitch-auth:
    image: ghcr.io/compico/tw-srv-twitch-auth:v1
    pull_policy: always
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${AUTH_DOMAIN:?укажите AUTH_DOMAIN в .env}
      ALLOWED_RETURN_ORIGINS: https://${APP_DOMAIN:?укажите APP_DOMAIN в .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?укажите COOKIE_DOMAIN в .env}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET}
      DB_PATH: /data/auth.db
    volumes:
      - auth-data:/data
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      # HTTP → редирект на HTTPS
      traefik.http.routers.tw-auth.rule: Host(`${AUTH_DOMAIN}`)
      traefik.http.routers.tw-auth.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP:-web}
      traefik.http.routers.tw-auth.middlewares: ${TRAEFIK_REDIRECT_MIDDLEWARE:-https-redirect@file}
      # HTTPS
      traefik.http.routers.tw-auth-secure.rule: Host(`${AUTH_DOMAIN}`)
      traefik.http.routers.tw-auth-secure.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.tw-auth-secure.tls: "true"
      traefik.http.routers.tw-auth-secure.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-cloudflare}
      traefik.http.routers.tw-auth-secure.middlewares: ${TRAEFIK_MIDDLEWARES:-default-headers@file}
      traefik.http.services.tw-auth.loadbalancer.server.port: "8081"

  memealerts:
    image: ghcr.io/compico/tw-srv-memealerts:v1
    pull_policy: always
    restart: unless-stopped
    depends_on: [twitch-auth]
    environment:
      PUBLIC_URL: https://${APP_DOMAIN:?укажите APP_DOMAIN в .env}
      AUTH_PUBLIC_URL: https://${AUTH_DOMAIN:?укажите AUTH_DOMAIN в .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?укажите COOKIE_DOMAIN в .env}
      AUTH_GRPC_ADDR: twitch-auth:9090
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET}
      MEMEALERTS_CLIENT_ID: ${MEMEALERTS_CLIENT_ID}
      MEMEALERTS_CLIENT_SECRET: ${MEMEALERTS_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${MEMEALERTS_ENCRYPTION_KEY}
      DB_PATH: /data/memealerts.db
    volumes:
      - memealerts-data:/data
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      # HTTP → редирект на HTTPS
      traefik.http.routers.tw-app.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.tw-app.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP:-web}
      traefik.http.routers.tw-app.middlewares: ${TRAEFIK_REDIRECT_MIDDLEWARE:-https-redirect@file}
      # HTTPS
      traefik.http.routers.tw-app-secure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.tw-app-secure.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.tw-app-secure.tls: "true"
      traefik.http.routers.tw-app-secure.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-cloudflare}
      traefik.http.routers.tw-app-secure.middlewares: ${TRAEFIK_MIDDLEWARES:-default-headers@file}
      traefik.http.services.tw-app.loadbalancer.server.port: "8080"

volumes:
  auth-data:
  memealerts-data:

networks:
  internal:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
